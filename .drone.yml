kind: pipeline
name: build client
steps:

  - name: docker client
    image: plugins/docker
    environment:
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
      SASTOKEN:
        from_secret: sas_token
      BRANCH: "${DRONE_BRANCH}"

    settings:
      registry: bmgfsre.azurecr.io
      repo: bmgfsre.azurecr.io/${DRONE_REPO_NAME,,}_client
      username: drone-push
      password:
        from_secret: DOCKER_PASSWORD
      context: .
      dockerfile: dockerfile
      build_args:
        - SASTOKEN
        - BRANCH
      tags:
        - "${DRONE_BUILD_NUMBER}"
        - "latest"

trigger:
  branch:
    - main
    - dev
  event:
    - pull_request
    - custom

image_pull_secrets:
  - dockerhubcreds
---
kind: pipeline
name: deploy to Nomad (production)

steps:
  - name: deploy to Nomad (production)
    image: gatesfoundation/nomad-client:latest
    environment:
      NOMAD_ADDR: https://aws-nomad.bmgf.io
      NOMAD_REGION: us-west-2
      NOMAD_TOKEN:
        from_secret: AWS_NOMAD_TOKEN
      NOMAD_VAR_domain_prod:
        from_secret: NOMAD_VAR_domain_prod_aws
      NAMESPACE:
        from_secret: NAMESPACE
      SASTOKEN:
        from_secret: sas_token
    commands:
      - sed -i "s/__REPO__NAME__/${DRONE_REPO_NAME,,}/g" ./jobspec.hcl
      - sed -i "s/__BUILD__NUMBER__/$DRONE_BUILD_PARENT/g" ./jobspec.hcl
      - sed -i "s/__NAMESPACE__/$NAMESPACE/g" ./jobspec.hcl
      - sed -i "s/__SASTOKEN__/$SASTOKEN/g" ./jobspec.hcl
      - nomad job run -ca-path=/etc/ssl/certs ./jobspec.hcl

trigger:
  target:
    - prod

image_pull_secrets:
  - dockerhubcreds